<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<meta name="robots" content="noindex"/>
<title>Not found — 10,000 Hours</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<script>
(function(){
  var d=document.documentElement, pref='auto';
  try{ var q=new URLSearchParams(location.search).get('theme'); if(q==='light'||q==='dark'||q==='auto') pref=q; else { var s=localStorage.getItem('tenk.theme'); if(s==='light'||s==='dark') pref=s; } }catch(e){}
  var theme=pref;
  if(pref==='auto'){ try{ theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }catch(e){ theme='light'; } }
  d.dataset.theme=theme; d.dataset.themePref=pref;
})();
</script>
<link rel="stylesheet" href="theme.css"/>
<style>
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);padding:32px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:300;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  .wrap{width:min(520px,100%);text-align:left}
  .mark{display:grid;grid-template-columns:repeat(3,10px);gap:5px;margin-bottom:42px}
  .mark i{width:10px;height:10px;border-radius:2.4px;background:var(--line-strong)}
  .mark i:nth-child(5){background:#c4b5fd}
  .mark i:nth-child(8){background:#a78bfa}
  .mark i:nth-child(9){background:#7c3aed}
  .kicker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
  h1{font-size:clamp(52px,12vw,96px);font-weight:200;letter-spacing:-.055em;line-height:.9;margin:14px 0 22px}
  p{font-size:14px;line-height:1.6;color:var(--muted);max-width:38ch}
  a{display:inline-flex;align-items:center;gap:9px;margin-top:34px;font-size:11px;letter-spacing:.06em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:5px;transition:border-color .18s var(--ease-out)}
  a:hover{border-color:var(--ink)}
  a svg{width:14px;height:14px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kicker">404 · no page here</div>
    <h1>Off the<br/>graph.</h1>
    <p>This day was never rendered. The console and the gallery are still where you left them.</p>
    <a href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      back to the console
    </a>
  </main>
</body>
</html>
